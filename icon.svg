<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5aa9ff"/>
      <stop offset="1" stop-color="#2459c4"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe066"/>
      <stop offset="1" stop-color="#ffb01f"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#sky)"/>
  <rect width="512" height="260" rx="112" fill="url(#sheen)"/>
  <!-- the runway -->
  <rect x="204" y="-10" width="104" height="540" fill="#14213d"/>
  <rect x="194" y="-10" width="10" height="540" fill="#ffffff" fill-opacity="0.85"/>
  <rect x="308" y="-10" width="10" height="540" fill="#ffffff" fill-opacity="0.85"/>
  <g fill="#ffffff" fill-opacity="0.9">
    <rect x="249" y="30" width="14" height="52" rx="5"/>
    <rect x="249" y="116" width="14" height="52" rx="5"/>
    <rect x="249" y="360" width="14" height="52" rx="5"/>
    <rect x="249" y="446" width="14" height="52" rx="5"/>
  </g>
  <!-- the aircraft: a soft shadow, then a chunky gold silhouette with a dark outline -->
  <g transform="translate(256 262) rotate(-28)">
    <g filter="url(#soft)" opacity="0.45" transform="translate(14 22)">
      <path d="M0 -150 C18 -150 24 -120 24 -90 L24 -30 L150 40 L150 78 L24 52 L24 100 L62 130 L62 160 L0 144 L-62 160 L-62 130 L-24 100 L-24 52 L-150 78 L-150 40 L-24 -30 L-24 -90 C-24 -120 -18 -150 0 -150Z" fill="#0a1020"/>
    </g>
    <path d="M0 -150 C18 -150 24 -120 24 -90 L24 -30 L150 40 L150 78 L24 52 L24 100 L62 130 L62 160 L0 144 L-62 160 L-62 130 L-24 100 L-24 52 L-150 78 L-150 40 L-24 -30 L-24 -90 C-24 -120 -18 -150 0 -150Z" fill="url(#gold)" stroke="#0a1020" stroke-width="14" stroke-linejoin="round"/>
    <path d="M0 -128 C8 -128 12 -112 12 -92 L-12 -92 C-12 -112 -8 -128 0 -128Z" fill="#14213d"/>
  </g>
</svg>
