name: Build & Deploy Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.5-stable"
  GODOT_TEMPLATE_DIR: "4.5.stable"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot (headless editor)
        run: |
          BASE=https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}
          curl -fsSL -o godot.zip $BASE/Godot_v${GODOT_VERSION}_linux.x86_64.zip
          unzip -q godot.zip
          sudo mv Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot
          godot --version

      # Only the single-threaded web templates are kept (cached) - the full .tpz is ~1.3 GB.
      - name: Cache web export templates
        id: tpl-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/${{ env.GODOT_TEMPLATE_DIR }}
          key: godot-web-templates-${{ env.GODOT_VERSION }}

      - name: Download export templates
        if: steps.tpl-cache.outputs.cache-hit != 'true'
        run: |
          BASE=https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}
          curl -fsSL -o templates.tpz $BASE/Godot_v${GODOT_VERSION}_export_templates.tpz
          mkdir -p tpl ~/.local/share/godot/export_templates/${GODOT_TEMPLATE_DIR}
          unzip -q templates.tpz 'templates/web_nothreads_*' 'templates/version.txt' -d tpl
          mv tpl/templates/* ~/.local/share/godot/export_templates/${GODOT_TEMPLATE_DIR}/
          rm -rf tpl templates.tpz

      # Short commit hash + UTC build time, shown as a stamp in the game's corner.
      - name: Stamp build info
        run: |
          SHORT=${GITHUB_SHA::7}
          printf 'class_name BuildInfo\nextends RefCounted\nconst COMMIT := "%s"\nconst TIME := "%s"\n' \
            "$SHORT" "$(date -u +'%Y-%m-%d %H:%M UTC')" > scripts/BuildInfo.gd
          cat scripts/BuildInfo.gd

      - name: Import project
        run: godot --headless --import || true  # first import can exit non-zero; export below is the real check

      # Headless smoke test: boot, landing, conflict -> game over, tap -> restart in place, tuning panel.
      # Fails the build on a failed check or on any GDScript runtime error in the output.
      - name: Smoke test
        shell: bash
        run: |
          set -o pipefail
          timeout 180 godot --headless --path . --script res://tests/smoke_test.gd 2>&1 | tee smoke.log
          ! grep -q "SCRIPT ERROR" smoke.log

      # The phone check: a mid-shift drawn normally and as a phone with a 16-bit depth buffer would draw it (the same picture, no
      # magenta-ish pixel anywhere: a missing texture or a bad shader input), on a software GL under a virtual display.
      - name: Phone check
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 > /dev/null
          xvfb-run -a godot --path . --rendering-driver opengl3 --script tools/mobile_check.gd -- out="$RUNNER_TEMP/phone" 2>&1 | grep -v "^ALSA\|^WARNING\|^   at:" | tee phone.log
          grep -q "^mobile check:" phone.log
          ! grep -q "^FAIL" phone.log

      # Cache-busting: export under a name containing the commit hash (so .js/.wasm/.pck are new
      # files every deploy), then make that page index.html and add a small stale-page check.
      - name: Export Web
        run: |
          SHORT=${GITHUB_SHA::7}
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/g-$SHORT.html
          mv build/web/g-$SHORT.html build/web/index.html
          echo "$SHORT" > build/web/version.txt
          sed "s/__BUILD__/$SHORT/" web/cache_bust.snippet.html > build/cache_bust.html
          sed -i '/<head>/r build/cache_bust.html' build/web/index.html
          grep -c "version.txt" build/web/index.html
          cp assets/fonts/BowlbyOneSC.ttf build/web/BowlbyOneSC.ttf   # (the loading page's wordmark font)
          mkdir -p build/web/audio && cp assets/audio/loops/*.wav build/web/audio/   # (the page plays the music loops natively)
          grep -q "Clear Prop" build/web/index.html
          ! grep -q '\$GODOT_' build/web/index.html
          ls -la build/web

      # The exported game, loaded in headless Chrome and tapped like a phone: sound must really come out of it
      # (the menu music after the first tap, the shift music after PLAY).
      - name: Web audio check
        timeout-minutes: 10
        run: |
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)
          echo "using $CHROME"
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" playwright-core
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node tools/web_audio_check.js build/web "$CHROME"

      # The wind must be visible: on an empty field two frames a moment apart differ where the streaks drift (and with ?nowind they do not).
      - name: Wind motion check
        timeout-minutes: 10
        run: |
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node tools/web_wind_check.js build/web "$CHROME"

      # Start-up and frame cost, at a 4x CPU slowdown: every start-up step is logged (the numbers are in the job log), the game's own
      # build must stay short and the worst frame of a shift in the game's own code (rendering is the browser's: this runner draws in
      # software, so only the game's share is judged) is gated as a RATIO to a reference workload timed first in the same browser
      # (tools/web_ref.js; a shared runner's speed moves the raw milliseconds by half), limited to 1.25 x the worst ratio of the last
      # ten green runs (tools/gate_history.json). The raw milliseconds stay in the log.
      - name: Start-up and frame check
        timeout-minutes: 20
        run: |
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)
          for i in 1 2 3; do
            REPORT=boot_$i.json QUERY=perf THROTTLE=4 LIMIT_BUILD_MS=9000 NODE_PATH="$RUNNER_TEMP/pw/node_modules" node tools/web_boot_check.js build/web "$CHROME"
          done
          python3 tools/median_gate.py --history tools/gate_history.json --label boot boot_1.json boot_2.json boot_3.json

      # Opening a panel must not stutter: Airports, Upgrades and the Hangar from the menu, the pause menu and the results card from a
      # shift, each at a 4x CPU slowdown, three runs; the median worst frame of each, as a ratio to the reference workload (see above),
      # may not pass its limit.
      - name: Panel open check
        timeout-minutes: 20
        run: |
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)
          for i in 1 2 3; do
            REPORT=panel_$i.json THROTTLE=4 NODE_PATH="$RUNNER_TEMP/pw/node_modules" node tools/web_panel_check.js build/web "$CHROME"
          done
          python3 tools/median_gate.py --history tools/gate_history.json --label panel panel_1.json panel_2.json panel_3.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  # The game must behave the same at 60, 30 and 20 frames a second (the frame-delta clamp is 1/20 s): each system on its own
  # (tools/step_micro.gd), then the whole economy / fairness survey at the three step sizes, which must agree within 5% on
  # landings, crashes and coins (tools/step_compare.py).
  frame-rate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot (headless editor)
        run: |
          BASE=https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}
          curl -fsSL -o godot.zip $BASE/Godot_v${GODOT_VERSION}_linux.x86_64.zip
          unzip -q godot.zip
          sudo mv Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot
      - name: Import project
        run: godot --headless --import || true
      - name: Each system at 60, 30 and 20 fps
        run: |
          set -o pipefail
          timeout 600 godot --headless --path . --script tools/step_micro.gd 2>&1 | grep -v "^\[boot\]" | tee micro.log
          ! grep -q "^FAIL\|SCRIPT ERROR" micro.log
      - name: The economy and fairness survey at 60, 30 and 20 fps
        run: |
          for f in 60 30 20; do
            (timeout 1700 godot --headless --path . --script tools/economy_sim.gd -- survey per=10 totals fps=$f 2>&1 | grep "^TOTALS" > sim_$f.txt) &
          done
          wait
          python3 tools/step_compare.py sim_60.txt sim_30.txt sim_20.txt

  deploy:
    needs: [build, frame-rate]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
