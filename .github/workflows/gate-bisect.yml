name: Gate bisect

# Where did the worst shift frame in the game's own code grow? Each job builds one commit and the baseline (default 818df89) and measures
# both, interleaved, three runs each on the same runner with the reference workload (tools/web_ref.js), then prints the median ratios.
# The tools are always this checkout's; only the game comes from the commit. Run by hand: Actions > Gate bisect; `commits` is a JSON list.

on:
  workflow_dispatch:
    inputs:
      commits:
        description: 'JSON list of commits, e.g. ["6cd1494","25ec2c9"]'
        required: true
      baseline:
        description: "The commit everything is compared with"
        required: false
        default: "818df89"

env:
  GODOT_VERSION: "4.5-stable"
  GODOT_TEMPLATE_DIR: "4.5.stable"

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        commit: ${{ fromJSON(inputs.commits) }}
        rep: [1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Godot (headless editor)
        run: |
          BASE=https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}
          curl -fsSL -o godot.zip $BASE/Godot_v${GODOT_VERSION}_linux.x86_64.zip
          unzip -q godot.zip
          sudo mv Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot

      - name: Cache web export templates
        id: tpl-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/${{ env.GODOT_TEMPLATE_DIR }}
          key: godot-web-templates-${{ env.GODOT_VERSION }}

      - name: Download export templates
        if: steps.tpl-cache.outputs.cache-hit != 'true'
        run: |
          BASE=https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}
          curl -fsSL -o templates.tpz $BASE/Godot_v${GODOT_VERSION}_export_templates.tpz
          mkdir -p tpl ~/.local/share/godot/export_templates/${GODOT_TEMPLATE_DIR}
          unzip -q templates.tpz 'templates/web_nothreads_*' 'templates/version.txt' -d tpl
          mv tpl/templates/* ~/.local/share/godot/export_templates/${GODOT_TEMPLATE_DIR}/
          rm -rf tpl templates.tpz

      - name: Export both
        run: |
          for pair in "base ${{ inputs.baseline }}" "cand ${{ matrix.commit }}"; do
            set -- $pair
            git worktree add ../$1 $2
            (cd ../$1 && godot --headless --import || true; mkdir -p build/web; godot --headless --export-release "Web" build/web/index.html; cp assets/fonts/BowlbyOneSC.ttf build/web/BowlbyOneSC.ttf; mkdir -p build/web/audio && cp assets/audio/loops/*.wav build/web/audio/)
          done

      - name: Measure
        timeout-minutes: 40
        run: |
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" playwright-core
          export NODE_PATH="$RUNNER_TEMP/pw/node_modules"
          for i in 1 2 3; do
            REPORT=cand_$i.json QUERY=perf THROTTLE=4 node tools/web_boot_check.js ../cand/build/web "$CHROME"
            REPORT=base_$i.json QUERY=perf THROTTLE=4 node tools/web_boot_check.js ../base/build/web "$CHROME"
          done
          python3 tools/median_gate.py --label cand cand_1.json cand_2.json cand_3.json | tee gate_cand.txt
          python3 tools/median_gate.py --label base base_1.json base_2.json base_3.json | tee gate_base.txt

      - name: Result
        run: |
          echo "BIS commit=${{ matrix.commit }} rep=${{ matrix.rep }}"
          grep -h "^GATE_DATA" gate_cand.txt gate_base.txt | sed 's/^/BIS /'
